name: Установщики и релиз

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional earlier run with identical Windows/Android build inputs'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ladno-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  checks:
    name: Проверки и версия
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate reused installers
        if: inputs.reuse_run_id != ''
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .head_sha)"
          python3 scripts/check-reused-builds.py "$source_sha"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash scripts/install-build-deps.sh --checks
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib test
      - run: flutter test --no-pub
      - id: version
        name: Проверить версию
        shell: bash
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Fedora RPM и Linux
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash scripts/install-build-deps.sh clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev libsecret-1-dev rpm xvfb
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --no-pub
      - name: Проверка запуска Linux
        shell: bash
        run: |
          set +e
          timeout 8s xvfb-run -a build/linux/x64/release/bundle/ladno > /tmp/ladno-start.log 2>&1
          result=$?
          set -e
          cat /tmp/ladno-start.log
          test "$result" -eq 124
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    if: ${{ inputs.reuse_run_id == '' }}
    name: Windows 10 x64 Setup
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - name: Включить библиотеки Visual C++
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ runtime not found' }
          Copy-Item "$($crt.FullName)\*.dll" build/windows/x64/runner/Release/
      - name: Создать установщик
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = (Resolve-Path build/windows/x64/runner/Release).Path
          $out = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$bundle" "/DOutputDir=$out" packaging/windows/ladno.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Проверить тихую установку и запуск
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Ladno-install-test'
          $installer = Start-Process "dist/ladno-$env:APP_VERSION-windows-x64-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$destination" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Installation failed' }
          $app = Start-Process "$destination/ladno.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($app.HasExited) { throw 'Application exited during startup' }
          Stop-Process -Id $app.Id
          $uninstall = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    if: ${{ inputs.reuse_run_id == '' }}
    name: Android APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Подключить постоянную подпись
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/configure-android-signing.py
      - run: flutter build apk --release --no-pub
      - name: Проверить подпись APK и упаковать
        env:
          APP_VERSION: ${{ needs.checks.outputs.version }}
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ladno-$APP_VERSION-android.apk"
      - name: Очистить материалы подписи
        if: always()
        run: python3 -c "from pathlib import Path; [p.unlink(missing_ok=True) for p in [Path('android/key.properties'), Path('android/release-key.jks')]]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installers-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ always() && needs.checks.result == 'success' && needs.linux.result == 'success' && (inputs.reuse_run_id != '' || (needs.windows.result == 'success' && needs.android.result == 'success')) }}
    name: GitHub Releases
    needs: [checks, linux, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.reuse_run_id != ''
        with:
          name: installers-windows
          path: dist
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.reuse_run_id != ''
        with:
          name: installers-android
          path: dist
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Комплект администратора Pterodactyl
        run: python3 scripts/package-admin.py
      - name: Контрольные суммы
        run: cd dist && sha256sum *.apk *.exe *.rpm *.tar.gz *.zip > SHA256SUMS.txt
      - name: Опубликовать установщики
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.checks.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$APP_VERSION" >/dev/null 2>&1; then
            echo 'This version already has a release; increase pubspec.yaml version.'
            exit 1
          fi
          gh release create "v$APP_VERSION" dist/* --target "$GITHUB_SHA" --title "Ладно $APP_VERSION — серверная синхронизация" --notes-file packaging/release-notes.md --prerelease
