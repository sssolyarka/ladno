name: Debian admin setup
on:
  pull_request:
    paths: ['deploy/admin/**', 'test/admin/**', '.github/workflows/admin-setup.yml']
  push:
    branches: ['codex/pterodactyl-admin-setup']
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check shell syntax
        run: bash -n deploy/admin/setup-ladno.sh test/admin/test-setup-container.sh
      - name: Test admin workflow in disposable Debian 13
        run: docker run --rm -e LADNO_SETUP_TEST_CONTAINER=1 -v "$PWD:/work:ro" -w /work debian:trixie-slim bash test/admin/test-setup-container.sh
