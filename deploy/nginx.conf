worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=enroll:1m rate=5r/m;
  client_max_body_size 8m;
  client_body_timeout 15s;
  server {
    listen 443 ssl;
    server_name makar.frogville.fun;
    ssl_certificate /etc/ladno-tls/fullchain.pem;
    ssl_certificate_key /etc/ladno-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location = /v1/enroll {
      limit_req zone=enroll burst=5 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
    }
    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 15s;
    }
  }
}
