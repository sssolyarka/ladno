services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    volumes:
      - ladno-data:/data
    environment:
      MAX_OPERATIONS: ${MAX_OPERATIONS:-100000}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-10737418240}
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports: ["443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR in .env}:/etc/ladno-tls:ro
    networks: [private, edge]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 128
networks:
  edge:
  private:
    internal: true
volumes:
  ladno-data:
